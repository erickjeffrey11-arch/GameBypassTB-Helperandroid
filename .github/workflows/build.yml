name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the app
        run: |
          set -o pipefail
          if ! gradle assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }} 2>&1 | tee build.log; then
            grep -v "> Task" build.log | grep -E -A4 "^e: |What went wrong|error:" | head -20 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            exit 1
          fi

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GameBypassTBHelper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GameBypassTBHelper
          path: GameBypassTBHelper.apk

      - name: Post the APK as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Game Bypass TB Helper build ${{ github.run_number }}
          files: GameBypassTBHelper.apk
